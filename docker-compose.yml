services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: datascalr
      POSTGRES_PASSWORD: datascalr
      POSTGRES_DB: datascalr
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./target-api/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U datascalr"]
      interval: 3s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

  target-api:
    build: ./target-api
    ports:
      - "127.0.0.1:8001:8000"
    environment:
      DATABASE_URL: postgresql://datascalr:datascalr@postgres:5432/datascalr
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  backend:
    build: ./backend
    env_file:
      - .env.production
    environment:
      TARGET_API_URL: http://target-api:8000
    depends_on:
      target-api:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ""
    depends_on:
      - backend

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
    depends_on:
      - backend
      - frontend

volumes:
  pgdata:
  caddy_data:
